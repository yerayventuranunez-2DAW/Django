<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Animales de la protectora</title>
</head>
<body>
    <header>
        <h1>Protectora de animales</h1>
        <nav>
            <a href="{% url 'index' %}">Home</a> |
            <a href="{% url 'animal_list' %}">Animales</a> |
            <a href="{% url 'protectora_list' %}">Protectoras</a> |
            <a href="{% url 'colaborador_list' %}">Colaboradores</a>
        </nav>
    </header>

    <h2>Animales</h2>
    {% for animal in animales_mostrar %}
        <article>
            <h3>{{ animal.nombre }}</h3>
            <p>Tipo: {{ animal.tipo }}</p>
            <p>Cuidador: {{ animal.cuidador.username }}</p>
        </article>
    {% empty %}
        <p>No hay animales registrados.</p>
    {% endfor %}
</body>
</html>
