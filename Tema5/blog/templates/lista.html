{%extends "base.html"%}

{%block cabecera%}
    <h1>Tareas del Proyecto: {{ proyecto.nombre }}</h1>
    
    <a href="{% url 'index' %}">Volver al Inicio</a>
{%endblock%}  

{%block contenido%}
    <ul>
        {% for tarea in tareas %}
            {% include "items/tarea_item.html" %}
        {% empty %}
            <li>No hay tareas registradas para este proyecto.</li>
        {% endfor %}
    </ul>
{%endblock%}
