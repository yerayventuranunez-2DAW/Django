{% extends "base.html" %}

{% block cabecera %}
    <h1>Listado de Proyectos</h1>
    <a href="{% url 'index' %}">Volver al Inicio</a>
{% endblock %}

{% block contenido %}
    <ul>
        {% for proyecto in proyectos %}
            {% include "items/proyecto_item.html" %}
        {% empty %}
            <li>No hay proyectos registrados.</li>
        {% endfor %}
    </ul>
{% endblock %}
