<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Entrenadores</title>
</head>
<body>
    <header>
        <h1>Gimnasio</h1>
        <nav>
            <a href="{% url 'entrenador_list' %}">Entrenadores</a> |
            <a href="{% url 'clase_list' %}">Clases</a> |
            <a href="{% url 'socio_list' %}">Socios</a>
        </nav>
    </header>

    {% for socio in socios_mostrar %}
        <article>
            <h2>{{ socio.nombre }}</h2>
            <p>Cuota mensual: {{ socio.cuota_mensual }} €</p>
            <p>Alta: {{ socio.fecha_alta }}</p>
        </article>
    {% endfor %}
</body>
</html>
