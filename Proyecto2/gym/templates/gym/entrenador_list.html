<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Entrenadores</title>
</head>
<body>
    <header>
        <h1>Gimnasio</h1>
        <nav>
            <a href="{% url 'entrenador_list' %}">Entrenadores</a> |
            <a href="{% url 'clase_list' %}">Clases</a> |
            <a href="{% url 'socio_list' %}">Socios</a>
        </nav>
    </header>

    {% for entrenador in entrenadores_mostrar %}
        <article>
            <h2>{{ entrenador.nombre }}</h2>
            <p>Especialidad: {{ entrenador.especialidad }}</p>
            <p>Contratado el: {{ entrenador.fecha_contratacion }}</p>
        </article>
    {% endfor %}
</body>
</html>
